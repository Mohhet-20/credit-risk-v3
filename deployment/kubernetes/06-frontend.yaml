apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: credit-risk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: credit-risk-frontend:latest # replace with your registry/tag
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: credit-risk-config
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: credit-risk
spec:
  selector:
    app: frontend
  ports:
    - port: 8501
      targetPort: 8501
