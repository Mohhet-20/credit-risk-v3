apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  namespace: credit-risk
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: credit-risk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: credit-risk-mlflow:latest # replace with your registry/tag, e.g.
                                            # ghcr.io/<org>/credit-risk-mlflow:<sha>
                                            # built from Dockerfile.mlflow -- bakes the
                                            # mlflow install in at build time instead of
                                            # pip-installing it on every container start,
                                            # which needed outbound PyPI access every
                                            # restart/pod reschedule and doesn't work at
                                            # all in a network-restricted cluster.
          env:
            - name: MLFLOW_ALLOW_FILE_STORE
              value: "true"
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mlflow-storage
              mountPath: /mlflow
          readinessProbe:
            httpGet: { path: /, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlflow-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: credit-risk
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
