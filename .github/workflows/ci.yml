name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}
  schedule:
    # Weekly, independent of any push -- catches newly-disclosed CVEs in
    # already-merged pinned dependencies, not just ones introduced by a PR.
    - cron: "0 6 * * 1"

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff==0.8.4 black==24.10.0

      - name: Ruff (static analysis)
        run: ruff check .

      - name: Black (format check)
        run: black --check --diff .

  dependency-audit:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install --no-cache-dir pip-audit==2.9.0

      # `continue-on-error: true` is deliberate here, not an oversight: this
      # job needs outbound network access to PyPI's advisory data (blocked
      # in some sandboxed/offline CI runners and firewalled corporate
      # environments), and a newly-disclosed CVE in a transitive dependency
      # should not silently block every PR merge for a team without a
      # pre-agreed remediation SLA. The scan output is still uploaded and
      # visible in the Actions run summary either way -- this is "alert
      # loudly," not "block silently, block always." Tighten this to a hard
      # failure once the team has a documented dependency-CVE triage process.
      - name: Run pip-audit against requirements.txt
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc -f json -o pip-audit-report.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
        if: always()

  test:
    name: Unit / integration / API tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Prepare runtime directories
        run: mkdir -p data/raw data/processed/checkpoints models/artifacts mlruns reports

      - name: Generate the synthetic dataset (seeded; tests read data/raw/credit_applications.csv)
        run: python -m data.generate_synthetic_data

      - name: Run test suite
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
        if: always()

  web:
    name: Web console (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test, web]
    # Runs on PRs too (not just push) so a broken Dockerfile is caught during
    # review, not after merge -- `push: false` below means this never
    # publishes an image either way, so there's no extra cost to running it
    # on every PR beyond CI minutes.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: credit-risk-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: credit-risk-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web console image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: credit-risk-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML services image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ml
          push: false
          tags: credit-risk-ml:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
